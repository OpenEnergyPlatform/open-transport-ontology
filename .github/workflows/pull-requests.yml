name: OTO CI PR
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - src/**
      - scripts/**
      - .github/workflows/pull-requests.yaml
  pull_request:
    branches:
      - main
      - develop
    paths:
      - src/**
      - scripts/**
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: make
        run: |
          make
      - name: validate-profile
        run: |
          echo "java -jar robot.jar validate-profile --input build/oto/$(cat VERSION)/oto-full.ttl --profile Full -vvv --output merged-validation.txt"
          java -jar robot.jar validate-profile --input build/oto/$(cat VERSION)/oto-full.ttl --profile Full -vvv --output merged-validation.txt
      - uses: actions/upload-artifact@master
        with:
          name: build-artifacts
          path: build/oto
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - uses: actions/download-artifact@master
        with:
          name: build-artifacts
          path: build/oto
      - name: setup robot 1.9.0
        run: |
          wget https://github.com/ontodev/robot/releases/download/v1.9.0/robot.jar -O robot.jar
      - name: consistency
        run: |
          wget https://github.com/owlcs/releases/raw/master/HermiT/org.semanticweb.hermit-packaged-1.4.6.519-SNAPSHOT.jar -O build/hermit.jar
          OUT=$(java -jar build/hermit.jar file://`pwd`/build/oto/$(cat VERSION)/oto-full.ttl -U)
          if [ "$(echo "$OUT" | tr -d '[:space:]')" = "Classesequivalentto'owl:Nothing':owl:Nothing" ];
          then
            exit 0
          fi
          echo "Ontology is inconsistent: $OUT"
          exit 1
