name: OTO CI
on:
  workflow_dispatch:
  push:
    # only on release commits
    # https://stackoverflow.com/a/71076957/1169798
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: restore dependencies
        id: cache-dependencies
        uses: actions/cache/restore@v6
        with:
          path: '*.jar'
          key: robot-1-9-10-widoco-1-4-25
      - name: fetch dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar -O robot.jar
          wget https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-17.jar -O widoco.jar
      - name: store dependencies
        uses: actions/cache/save@v6
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        with:
          path: '*.jar'
          key: ${{ steps.cache-dependencies.outputs.cache-primary-key }}
      - name: make
        run: |
            make
      - name: build documentation
        run: |
          java -jar widoco.jar \
            -ontFile build/oto/$(cat VERSION)/oto-full.ttl \
            -rewriteAll \
            -uniteSections \
            -noPlaceHolderText \
            -outFolder build/
      - name: rename index file
        run: mv build/doc/index-en.html build/doc/index.html

      - name: upload artifacts
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/doc

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
